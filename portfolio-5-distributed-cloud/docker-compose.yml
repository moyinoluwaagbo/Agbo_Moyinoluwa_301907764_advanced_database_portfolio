services:
  primary:
    image: postgres:16
    container_name: mivadb_primary
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespass
      POSTGRES_DB: mivadb
    command: postgres -c hba_file=/etc/postgresql/pg_hba.conf
    ports:
      - "5433:5432"
    volumes:
      - primary_data:/var/lib/postgresql/data
      - ./pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./init-primary.sql:/docker-entrypoint-initdb.d/init-primary.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d mivadb"]
      interval: 3s
      timeout: 3s
      retries: 20

  replica:
    image: postgres:16
    container_name: mivadb_replica
    user: postgres
    depends_on:
      primary:
        condition: service_healthy
    environment:
      PGPASSWORD: replpass
    ports:
      - "5434:5432"
    volumes:
      - replica_data:/var/lib/postgresql/data
    entrypoint: ["bash", "-c"]
    command:
      - |
        if [ ! -s "$$PGDATA/PG_VERSION" ]; then
          echo "Copying data from primary..."
          pg_basebackup -h primary -U replicator -D "$$PGDATA" -Fp -Xs -P -R
          chmod 700 "$$PGDATA"
        fi
        exec postgres -c hot_standby=on

volumes:
  primary_data:
  replica_data:
